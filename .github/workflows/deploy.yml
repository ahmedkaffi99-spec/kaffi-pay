name: Deploy Firebase (Functions + Hosting)

on:
  push:
    branches:
      - claude/fait-fix-DjJ6q

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Create functions env file
        run: |
          printf 'TELEGRAM_TOKEN=%s\n'      '${{ secrets.TELEGRAM_TOKEN }}'      > functions/.env.kaffi-pay
          printf 'TELEGRAM_ADMIN_CHAT_ID=%s\n' '${{ secrets.TELEGRAM_ADMIN_ID }}' >> functions/.env.kaffi-pay
          printf 'MACRODROID_SECRET=%s\n'   '${{ secrets.MACRODROID_SECRET }}'   >> functions/.env.kaffi-pay
          printf 'SUPPORT_BOT_TOKEN=%s\n'   '${{ secrets.SUPPORT_BOT_TOKEN }}'   >> functions/.env.kaffi-pay
          printf 'GREEN_API_ID=%s\n'        '${{ secrets.GREEN_API_ID }}'        >> functions/.env.kaffi-pay
          printf 'GREEN_API_TOKEN=%s\n'     '${{ secrets.GREEN_API_TOKEN }}'     >> functions/.env.kaffi-pay
          printf 'MOBCASH_HASH=%s\n'        '${{ secrets.MOBCASH_HASH }}'        >> functions/.env.kaffi-pay
          printf 'MOBCASH_CASHIERPASS=%s\n' '${{ secrets.MOBCASH_CASHIERPASS }}' >> functions/.env.kaffi-pay
          printf 'MOBCASH_CASHDESKID=%s\n'  '${{ secrets.MOBCASH_CASHDESKID }}'  >> functions/.env.kaffi-pay
          printf 'MOBCASH_LOGIN=%s\n'       '${{ secrets.MOBCASH_LOGIN }}'       >> functions/.env.kaffi-pay
          echo "=== ENV KEYS CHECK (values masked) ==="
          while IFS='=' read -r key val; do
            [ -n "$val" ] && echo "$key = *** SET" || echo "$key = !!! EMPTY"
          done < functions/.env.kaffi-pay

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Delete existing Cloud Functions (gen2) to clear old secret bindings
        run: |
          REGION=europe-west1
          PROJECT=kaffi-pay
          FUNCTIONS=(
            onNouvelDepot onNouvelRetrait onDepotUpdated onRetraitUpdated
            ordresBloques smsWebhook testTelegram testMobcash
            waRecap supportClient adminBot adminRetryDeposit
            adminActionOrdre purgeOrdresAnciens
            healthCheck adminAgents adminReserves adminStats
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deleting gen2 function: $fn"
            gcloud functions delete "$fn" \
              --gen2 \
              --region="$REGION" \
              --project="$PROJECT" \
              --quiet 2>/dev/null || true
          done
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions,hosting,firestore --project kaffi-pay --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
