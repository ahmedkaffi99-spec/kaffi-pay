name: Deploy Firebase (Functions + Hosting)

on:
  push:
    branches:
      - claude/fait-fix-DjJ6q

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: cd functions && npm install

      - name: Create functions env file
        run: |
          cat > functions/.env.kaffi-pay << 'EOF'
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID=${{ secrets.TELEGRAM_ADMIN_ID }}
          MACRODROID_SECRET=${{ secrets.MACRODROID_SECRET }}
          SUPPORT_BOT_TOKEN=${{ secrets.SUPPORT_BOT_TOKEN }}
          GREEN_API_ID=${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN=${{ secrets.GREEN_API_TOKEN }}
          MOBCASH_HASH=${{ secrets.MOBCASH_HASH }}
          MOBCASH_CASHIERPASS=${{ secrets.MOBCASH_CASHIERPASS }}
          MOBCASH_CASHDESKID=${{ secrets.MOBCASH_CASHDESKID }}
          MOBCASH_LOGIN=${{ secrets.MOBCASH_LOGIN }}
          EOF

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Delete existing Cloud Functions to clear old secret bindings
        run: |
          REGION=europe-west1
          PROJECT=kaffi-pay
          FUNCTIONS=(
            onNouvelDepot onNouvelRetrait onDepotUpdated onRetraitUpdated
            ordresBloques smsWebhook testTelegram testMobcash
            waRecap supportClient adminBot adminRetryDeposit
            adminActionOrdre purgeOrdresAnciens
          )
          for fn in "${FUNCTIONS[@]}"; do
            echo "Deleting function: $fn"
            gcloud functions delete "$fn" \
              --region="$REGION" \
              --project="$PROJECT" \
              --quiet 2>/dev/null || true
          done
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}

      - name: Deploy to Firebase
        run: npx firebase-tools@latest deploy --only functions,hosting,firestore --project kaffi-pay --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
